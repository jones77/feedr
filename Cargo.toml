[package]
name = "feedr"
version = "0.8.0"
edition = "2021"
description = "Feedr is a feature-rich terminal-based RSS/Atom feed reader written in Rust."
documentation = "https://github.com/bahdotsh/feedr"
homepage = "https://github.com/bahdotsh/feedr"
repository = "https://github.com/bahdotsh/feedr"
keywords = ["rss", "atom", "feed-reader", "terminal", "tui"]
categories = ["command-line-utilities", "text-processing", "web-programming"]
license = "MIT"

[[bin]]
name = "feedr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ratatui = "0.23"
crossterm = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["blocking", "gzip", "deflate", "brotli"] }
feed-rs = "2.3"
dirs = "5.0"
html2text = "0.6"
open = "3.2"
chrono = "0.4"
unicode-width = "0.1.11"
uuid = { version = "1.4", features = ["v4", "serde"] }
clap = { version = "4.0", features = ["derive"] }
opml = "1.1.6"
toml = "0.8"
scraper = "0.18"
url = "2"
shlex = "1.3"
# dom_smoothie is pre-1.0 and is the security-critical HTML parsing surface
# for the full-text extraction path. Cargo.lock is committed (so the actual
# version pin is enforced there), and the default `"0.17"` (=caret) already
# blocks 0.18+ on pre-1.0 crates. The explicit `~0.17` here is intent
# signaling — it makes "patch-only updates allowed; major-version bumps
# require manual review" obvious at the manifest level rather than only in
# the lockfile.
dom_smoothie = "~0.17"
encoding_rs = "0.8"

[profile.release]
codegen-units = 1
lto = true
